services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: eattasty
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '5555'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d eattasty']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
